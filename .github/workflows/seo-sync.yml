name: SEO catalog sync

# Keeps crawlable service pages + sitemap in sync with the live catalog.
# A service added in the admin panel appears on the site automatically within
# one scheduled run — no manual file edits and no daily work.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate SEO files from catalog
        run: node scripts/generate-seo.mjs

      - name: Commit changes (only if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public
          if git diff --cached --quiet; then
            echo "No catalog changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(seo): sync generated service pages [skip ci]"
          git push
